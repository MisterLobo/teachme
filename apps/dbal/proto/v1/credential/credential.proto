syntax = "proto3";

package v1.credential;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/misterlobo/teachme/v1/credential";

/*
 * Booking Service
 */
service CredentialService {
  /*
   * Store a Credential
   */
  rpc StoreDevice (CredentialStoreDeviceParams) returns (CredentialResponse);
  /*
   * Retrieve a Credential
   */
  rpc RetrieveDevice (CredentialRetrieveDeviceParams) returns (CredentialResponse);
  /*
   * List Credentials
   */
  rpc ListDevices (CredentialListDevicesParams) returns (CredentialResponse);

  rpc StoreKeys (CredentialStoreKeysParams) returns (CredentialResponse);

  rpc SaveKey (CredentialStoreKeysParams) returns (CredentialResponse);

  rpc RetrieveKeys (CredentialRetrieveKeysParams) returns (CredentialResponse);

  rpc RegisterBegin (google.protobuf.Empty) returns (CredentialRegisterBeginResponse);

  rpc RegisterFinish (CredentialRegisterFinishRequest) returns (CredentialRegisterFinishResponse);

  rpc LoginBegin (CredentialLoginBeginRequest) returns (CredentialLoginBeginResponse);

  rpc LoginFinish (CredentialLoginFinishRequest) returns (CredentialLoginFinishResponse);

  rpc OpaqueRegisterBegin (OpaqueRegisterBeginRequest) returns (OpaqueRegisterBeginResponse);

  rpc OpaqueRegisterFinish (OpaqueRegisterFinishRequest) returns (OpaqueRegisterFinishResponse);

  rpc OpaqueLoginBegin (OpaqueLoginBeginRequest) returns (OpaqueLoginBeginResponse);

  rpc OpaqueLoginFinish (OpaqueLoginFinishRequest) returns (OpaqueLoginFinishResponse);

  rpc OpaqueBatchRegisterBegin (OpaqueBatchRegisterBeginRequest) returns (OpaqueBatchRegisterBeginRespose);

  rpc OpaqueBatchRegisterFinish(OpaqueBatchRegisterFinishRequest) returns (OpaqueBatchRegisterFinishResponse);
}

message CredentialRegisterBeginRequest {
}

message CredentialRegisterBeginResponse {
  bytes options_json = 1;
  string session_id = 2;
  bytes challenge = 3;
}

message CredentialRegisterFinishRequest {
  string session_id = 1;
  bytes enc_mk = 2;
  bytes mk_iv = 3;
  bytes response = 4;
  message WrappedMasterKey {
    bytes cipher = 1;
    bytes iv = 2;
    bytes recovery_tag = 3;
  }
  repeated WrappedMasterKey master_keys = 5;
}

message CredentialRegisterFinishResponse {
  bool success = 1;
  string credential_id = 2;
  string status = 3;
  string status_code = 4;
}

message CredentialLoginBeginRequest {
  string email = 1;
}

message CredentialLoginBeginResponse {
  string challenge = 1;
  string rp_id = 2;
  bytes options_json = 3;
  string session_id = 4;
  bytes pid = 5;
}

message CredentialLoginFinishRequest {
  string session_id = 1;
  bytes response = 2;
}

message CredentialLoginFinishResponse {
  bool success = 1;
  string message = 2;
  bytes enc_mk = 3;
  bytes prf_salt = 4;
  bytes recovery_tags = 5;
}

message OpaqueRegisterBeginRequest {
  bytes client_registration_state = 1;
  bytes registration_request = 2;
}

message OpaqueRegisterBeginResponse {
  string registration_response = 1;
  string server_setup = 2;
}

message OpaqueRegisterFinishRequest {
  bytes registration_record = 1;
}

message OpaqueRegisterFinishResponse {
  string status = 1;
  int32 status_code = 2;
  optional string error = 3;
}

message OpaqueBatchRegisterBeginRequest {
  repeated OpaqueRegisterBeginRequest requests = 1;
}

message OpaqueBatchRegisterBeginRespose {
  repeated OpaqueRegisterBeginResponse responses = 1;
}

message OpaqueBatchRegisterFinishRequest {
  repeated OpaqueRegisterFinishRequest requests = 1;
}

message OpaqueBatchRegisterFinishResponse {
  repeated OpaqueRegisterFinishResponse responses = 1;
}

message OpaqueLoginBeginRequest {
  bytes client_login_state = 1;
  bytes start_login_request = 2;
}

message OpaqueLoginBeginResponse {
  string login_response = 1;
  string server_login_state = 2;
}

message OpaqueLoginFinishRequest {
  bytes finish_login_request = 1;
  bytes session_key = 2;
}

message OpaqueLoginFinishResponse {
  string status = 1;
  int32 status_code = 2;
  optional string error = 3;
  optional bytes salt = 4;
}

message CredentialStoreDeviceParams {
  string device_name = 1;
  optional string description = 2;
  string public_key = 3;
  bool enabled = 4;
}

message CredentialRetrieveDeviceParams {
  string device_name = 1;
}

message CredentialListDevicesParams {
  bool active = 1;
}

message CredentialDevice {
  string name = 1;
  string public_key = 2;
  optional string description = 3;
  bool active = 4;
  bool enabled = 5;
}

message CredentialDeviceResponse {
  repeated CredentialDevice devices = 1;
}

message CredentialStoreKeysParams {
  message UserKey {
    string master_key_cipher = 1;
    string salt = 2;
    optional string key_cipher = 3;
    optional string public_key = 4;
  }
  message DeviceKey {
    string master_key_cipher = 1;
    string salt = 2;
    optional string key_cipher = 3;
    optional string public_key = 4;
  }
  message SessionKey {
    bytes code_cipher = 1;
    bytes salt = 2;
  }
  bytes encoded_blob = 1;
  optional UserKey user_key = 2;
  optional SessionKey session_key = 3;
  optional DeviceKey device_key = 4;
  string key_type = 5;
  bytes public_key = 6;
  optional string credential_id = 7;
  string salt = 8;
}

message CredentialRetrieveKeysParams {
  string type = 1;
}

message CredentialResponse {
  message UserKey {}
  message SessionKey {}

  string status = 1;
  int32 status_code = 2;

  oneof data {
    UserKey user_key = 3;
    SessionKey session_key = 4;
    CredentialDeviceResponse list = 5;
  }
}
